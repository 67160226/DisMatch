<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DishMatch | หน้าแรก</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <main class="auth-card" style="text-align: center;">
            <div class="brand">
                <!-- โลโก้พริกเปลวไฟ DishMatch -->
                <img src="Logo_Dishmatch.png" alt="DishMatch Logo" style="width: 110px; height: 110px; object-fit: contain; margin: 0 auto 16px; filter: drop-shadow(0 0 15px rgba(255, 26, 117, 0.6));">
                
                <h1 style="font-size: 32px; font-weight: 800; background: linear-gradient(135deg, #ffffff 0%, #ff1a75 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 8px;">
                    DishMatch
                </h1>
                
                <p class="muted" style="font-size: 15px; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px;">
                    แอปพลิเคชันช่วยคิดเมนูอาหาร ปัดเลือกเมนูกับเพื่อน หรือเปิดกล่องสุ่มเมนูง่ายๆ ใน 1 นาที!
                </p>
            </div>

            <div style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                <a href="login.html" class="btn btn-primary btn-large" style="display: flex; align-items: center; justify-content: center; text-decoration: none;">
                    เข้าสู่ระบบ
                </a>
                <a href="register.html" class="btn btn-secondary btn-large" style="display: flex; align-items: center; justify-content: center; text-decoration: none;">
                    สมัครสมาชิกใหม่
                </a>
            </div>
        </main>
    </div>
</body>
</html>
