server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ให้เข้า /login, /register, /dashboard ได้โดยไม่ต้องพิมพ์ .html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Proxy ไปที่ FastAPI — เบราว์เซอร์จึงเรียก API แบบ same-origin (ไม่ต้องตั้ง CORS)
    # ปิดท้าย proxy_pass ด้วย "/" เพื่อตัด prefix /api ออก: /api/register -> /register
    location /api/ {
        proxy_pass http://fastapi_app:8000/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
