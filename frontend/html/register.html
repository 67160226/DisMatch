<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DishMatch | สมัครสมาชิก</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google OAuth Client SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
    <div class="container">
        <main class="auth-card">
            <div class="brand" style="text-align: center;">
                <img src="Logo_Dishmatch.png" alt="DishMatch Logo"
                    style="width: 80px; height: 80px; object-fit: contain; margin-bottom: 12px;">
                <h2>สมัครสมาชิก DishMatch</h2>
                <p class="muted">สร้างบัญชีเพื่อเริ่มสุ่มและปัดเลือกอาหารกับเพื่อน</p>
            </div>

            <form id="register-form" onsubmit="event.preventDefault(); handleRegister();">
                <div class="form-group">
                    <label for="username">ชื่อผู้ใช้ (Username)</label>
                    <input type="text" id="username" placeholder="เช่น john_doe" required>
                </div>

                <div class="form-group">
                    <label for="email">อีเมล (Email)</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password">รหัสผ่าน</label>
                    <input type="password" id="password" placeholder="ตั้งรหัสผ่าน..." required>
                </div>

                <div class="form-group">
                    <label for="confirm">ยืนยันรหัสผ่าน</label>
                    <input type="password" id="confirm" placeholder="กรอกรหัสผ่านอีกครั้ง..." required>
                </div>

                <button type="submit" class="btn btn-primary btn-large" style="width: 100%; margin-top: 12px;">
                    สมัครสมาชิก
                </button>
            </form>

            <div style="margin: 20px 0; text-align: center; color: var(--text-muted); position: relative;">
                <span>หรือเข้าสู่ระบบด้วย</span>
            </div>

            <!-- ปุ่ม Google Sign-In -->
            <div style="display: flex; justify-content: center; margin-bottom: 20px;">
                <div id="g_id_onload"
                    data-client_id="442327447287-itsteth7ufnpfhvgep91rfqbjeqnqatp.apps.googleusercontent.com"
                    data-callback="handleGoogleLogin">
                </div>
                <div class="g_id_signin" data-type="standard" data-shape="rectangular" data-theme="outline"
                    data-text="signup_with" data-size="large"></div>
            </div>

            <p style="text-align: center; margin-top: 16px; font-size: 14px;">
                มีบัญชีอยู่แล้ว? <a href="login.html"
                    style="color: var(--primary); text-decoration: none; font-weight: bold;">เข้าสู่ระบบ</a>
            </p>
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
