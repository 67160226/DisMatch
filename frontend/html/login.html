<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DishMatch | เข้าสู่ระบบ</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="blur-bg">

    <!-- Modal Backdrop -->
    <div class="modal-overlay">
        <div class="login-card">

            <!-- ขอบสี Gradient ด้านบนการ์ด -->
            <div class="top-accent-bar"></div>

            <!-- ปุ่มปิดมุมขวาบน -->
            <button class="close-btn" onclick="window.location.href='index.html'">✕</button>

            <!-- ส่วนหัวการ์ด (ไอคอน + ข้อความต้อนรับ) -->
            <div class="card-header">
                <div class="icon-badge">
                    🔒
                </div>
                <h2>ยินดีต้อนรับกลับมา</h2>
                <p class="subtitle">กรุณาเข้าสู่ระบบเพื่อเริ่มใช้งาน DishMatch</p>
            </div>

            <!-- ปุ่ม Google Login -->
            <div class="google-btn-container">
                <button type="button" class="btn-google"
                    onclick="document.querySelector('.g_id_signin div[role=button]')?.click()">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    <span>เข้าสู่ระบบด้วย Google</span>
                </button>

                <!-- ซ่อน Google SDK ไว้เบื้องหลัง -->
                <div style="display:none;">
                    <div id="g_id_onload"
                        data-client_id="442327447287-itsteth7ufnpfhvgep91rfqbjeqnqatp.apps.googleusercontent.com"
                        data-callback="handleGoogleLogin">
                    </div>
                    <div class="g_id_signin"></div>
                </div>
            </div>

            <!-- เส้นแบ่ง หรือใช้ชื่อผู้ใช้ -->
            <div class="divider">
                <span>หรือใช้ชื่อผู้ใช้</span>
            </div>

            <!-- ฟอร์มเข้าสู่ระบบ -->
            <form id="login-form" onsubmit="event.preventDefault(); handleLogin();">
                <div class="form-group">
                    <label for="username-input">ชื่อผู้ใช้ (USERNAME)</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input type="text" id="username-input" placeholder="กรอกชื่อผู้ใช้..." required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password-input">รหัสผ่าน (PASSWORD)</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password-input" placeholder="กรอกรหัสผ่าน..." required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">
                    เข้าสู่ระบบ
                </button>
            </form>

            <!-- ท้ายการ์ด -->
            <div class="card-footer">
                ยังไม่มีบัญชีใช่ไหม? <a href="register.html">สมัครสมาชิกที่นี่</a>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
