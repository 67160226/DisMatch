<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DishMatch | ห้องปัดอาหาร</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <main class="app-dashboard">

            <!-- Brand Bar -->
            <div class="app-brand-bar">
                <div class="brand-logo-wrapper">
                    <img src="Logo_Dishmatch.png" alt="DishMatch Logo" class="brand-logo-img">
                    <span class="brand-title">DishMatch</span>
                </div>
                <button onclick="window.location.href='dashboard.html'" class="btn btn-secondary"
                    style="padding: 6px 12px; font-size: 14px;">
                    ✕ ออกจากห้อง
                </button>
            </div>

            <!-- ข้อมูลห้อง & รายชื่อเพื่อน -->
            <section class="card" style="margin-bottom: 20px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                    <div>
                        <span class="muted" style="font-size: 12px;">รหัสห้อง (ROOM CODE)</span>
                        <h2 id="room-code-display" style="font-size: 28px; color: var(--primary); letter-spacing: 2px;">
                            ------</h2>
                    </div>
                    <button onclick="handleRandomFood()" class="btn btn-secondary"
                        style="background: #8b5cf6; color: white; border: none; padding: 8px 14px; border-radius: 12px; font-weight: bold; cursor: pointer;">
                        🎲 สุ่มเมนู
                    </button>
                </div>

                <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px;">
                    <p style="font-size: 14px; font-weight: bold; margin-bottom: 8px; color: #fff;">👥
                        เพื่อนในห้องตอนนี้:</p>
                    <div id="member-list" style="display: flex; flex-wrap: wrap; gap: 8px;">
                        <span style="color: var(--text-muted); font-size: 13px;">กำลังโหลดรายชื่อเพื่อน...</span>
                    </div>
                </div>
            </section>

            <!-- ส่วนปัดการ์ดอาหาร (Swipe Section) -->
            <section id="swipe-section" class="card" style="text-align: center; padding: 20px;">
                <p class="subtitle" style="margin-bottom: 16px; font-size: 14px; color: #ccc;">👉 ปัดซ้าย (ไม่เอา) |
                    ปัดขวา (อยากกิน) 👈</p>

                <div class="food-card-wrapper" style="display: flex; justify-content: center; margin-bottom: 20px;">
                    <div class="food-card"
                        style="width: 100%; max-width: 320px; height: 380px; border-radius: 16px; background-size: cover; background-position: center; position: relative; display: flex; align-items: flex-end; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
                        <div
                            style="background: linear-gradient(transparent, rgba(0,0,0,0.95)); width: 100%; padding: 20px; text-align: left;">
                            <h2 id="food-title" style="color: #fff; font-size: 24px; margin: 0;">กำลังโหลดเมนู...</h2>
                        </div>
                    </div>
                </div>

                <!-- ปุ่มควบคุมสไตล์เดิม -->
                <div style="display: flex; justify-content: center; gap: 16px; margin-top: 20px;">
                    <button onclick="handleSwipe(false)"
                        style="background: rgba(255, 71, 87, 0.1); border: 2px solid #ff4757; color: #ff4757; padding: 12px 28px; border-radius: 16px; font-weight: bold; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all 0.2s;">
                        ✕ ไม่เอา
                    </button>
                    <button onclick="handleSwipe(true)"
                        style="background: #2ed573; border: none; color: white; padding: 12px 28px; border-radius: 16px; font-weight: bold; font-size: 16px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(46, 213, 115, 0.4); transition: all 0.2s;">
                        💎 อยากกิน!
                    </button>
                </div>
            </section>

        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
